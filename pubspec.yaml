name: just_reminder
description: "Simple, beautiful reminders with home screen widgets."
publish_to: "none"

version: 0.2.0+2

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # Your chosen stack
  flutter_riverpod: ^3.4.3 # state management
  go_router: ^18.1.3 # navigation
  sembast: ^3.10.0 # local database
  home_widget: ^0.10.0 # home screen widgets

  # Approved helpers
  flutter_local_notifications: ^22.3.3 # scheduled notifications + Acknowledge action
  timezone: ^0.11.2 # required by zonedSchedule
  path_provider: ^2.1.6 # location of the sembast database file
  intl: ^0.20.3 # date/time formatting
  dynamic_color: ^2.1.0 # Material You (wallpaper colors)

  # Flutter's Material library (moved out of the framework in Flutter 3.47;
  # go_router and dynamic_color already build on it).
  material_ui: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
